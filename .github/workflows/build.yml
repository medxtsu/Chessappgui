name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.x"
          channel: stable
      - run: |
          unzip chess_gui.zip
          flutter create --platforms=android app
          cp -r chess_gui/lib app/
          cp chess_gui/pubspec.yaml app/pubspec.yaml
          cd app
          flutter pub get
          find ~/.pub-cache -path '*stockfish-*/android/build.gradle' -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*.apk
